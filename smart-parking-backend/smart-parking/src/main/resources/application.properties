# ===================== SERVER =====================
server.port=8080

# ===================== DATABASE =====================
# Change 'root' and 'yourpassword' to your own MySQL username/password.
# The database 'smart_parking' will be created automatically if it doesn't exist
# (because of createDatabaseIfNotExist=true).
spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / HIBERNATE =====================
# ddl-auto=update -> Hibernate will create/update tables automatically based on your entities.
spring.jpa.hibernate.ddl-auto=update
# show-sql=true -> prints the SQL Hibernate generates, useful while learning.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===================== JACKSON (JSON) =====================
# Makes LocalDateTime fields serialize as readable ISO strings instead of arrays of numbers.
spring.jackson.serialization.write-dates-as-timestamps=false
